<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحدي تفكيك القنبلة 💣</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --bg-color: #0d021a;
            --card-bg: #190633;
            --accent-pink: #ff007f;
            --accent-cyan: #00f0ff;
            --accent-yellow: #ffe600;
            --danger-red: #ff2a2a;
            --text-color: #ffffff;
        }

        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
        body { background-color: var(--bg-color); color: var(--text-color); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .game-container { width: 100%; max-width: 850px; background: var(--card-bg); border: 3px solid var(--accent-pink); border-radius: 24px; padding: 35px; box-shadow: 0 0 35px rgba(255, 0, 127, 0.4); text-align: center; position: relative; }
        
        h1 { color: var(--accent-yellow); font-size: 2.5rem; margin-bottom: 15px; text-shadow: 0 0 10px var(--accent-yellow); }
        .screen { display: none; animation: fadeIn 0.3s ease-in-out; }
        .screen.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }

        /* Timer Bomb UI */
        .bomb-timer { font-size: 4rem; font-weight: bold; color: var(--danger-red); background: #000; border: 3px solid var(--danger-red); border-radius: 16px; padding: 10px 30px; display: inline-block; margin: 20px 0; font-family: monospace; box-shadow: 0 0 20px var(--danger-red); }
        
        #qrcode { background: white; padding: 15px; border-radius: 16px; display: inline-block; margin: 20px 0; box-shadow: 0 0 25px rgba(255, 255, 255, 0.5); }
        
        .btn { background: linear-gradient(45deg, var(--accent-pink), #b000ff); color: white; border: none; padding: 15px 35px; font-size: 1.2rem; font-weight: bold; border-radius: 50px; cursor: pointer; transition: 0.3s; margin: 10px; box-shadow: 0 0 15px rgba(255, 0, 127, 0.4); }
        .btn:hover { transform: scale(1.05); }
        .btn-cyan { background: linear-gradient(45deg, var(--accent-cyan), #0077ff); box-shadow: 0 0 15px rgba(0, 240, 255, 0.4); }
        .btn-wire { width: 100%; padding: 18px; font-size: 1.3rem; margin: 10px 0; border-radius: 12px; }

        .wire-red { background: #d32f2f; }
        .wire-blue { background: #1976d2; }
        .wire-yellow { background: #fbc02d; color: #000; }
        
        .status-msg { font-size: 1.8rem; margin: 20px 0; font-weight: bold; }
    </style>
</head>
<body>

    <div class="game-container">
        <!-- Screen 1: Lobby & QR Code -->
        <div id="screen-lobby" class="screen active">
            <h1>💣 تحدي تفكيك القنبلة</h1>
            <p style="font-size: 1.2rem; color: var(--accent-cyan);">امسحوا الـ QR Code بموبايلاتكم عشان تدخلوا فرقة التفكيك!</p>
            
            <div id="qrcode"></div>
            <br>
            <button class="btn btn-cyan" onclick="startBombGame()">ابدأ العد التنازلي! ⏳</button>
        </div>

        <!-- Screen 2: Active Bomb -->
        <div id="screen-bomb" class="screen">
            <h1 style="color: var(--accent-pink);">⚠️ الخطر قائم! اختاروا السلك الصح!</h1>
            <div class="bomb-timer" id="timer-display">00:30</div>
            
            <p style="margin-bottom: 20px;">قدامكم 30 ثانية بس ياما القنبلة هتفرقع! 💥</p>
            
            <button class="btn btn-wire wire-red" onclick="defuse(false)">قطع السلك الأحمر 🔴</button>
            <button class="btn btn-wire wire-blue" onclick="defuse(true)">قطع السلك الأزرق 🔵</button>
            <button class="btn btn-wire wire-yellow" onclick="defuse(false)">قطع السلك الأصفر 🟡</button>
        </div>

        <!-- Screen 3: Win / Lose Result -->
        <div id="screen-result" class="screen">
            <div id="result-content"></div>
            <br><br>
            <button class="btn btn-cyan" onclick="resetGame()">محاولة جديدة 🔄</button>
        </div>
    </div>

    <script>
        let timeLeft = 30;
        let timerInterval = null;

        window.onload = function() {
            new QRCode(document.getElementById("qrcode"), {
                // الرابط بتاعك المباشر على GitHub Pages:
                text: "https://logainibrahim163-pixel.github.io/interactive-game-/",
                width: 180,
                height: 180,
                colorDark : "#0d021a",
                colorLight : "#ffffff",
                correctLevel : QRCode.CorrectLevel.H
            });
        };

        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function startBombGame() {
            showScreen('screen-bomb');
            timeLeft = 30;
            document.getElementById('timer-display').innerText = "00:30";
            
            timerInterval = setInterval(() => {
                timeLeft--;
                let seconds = timeLeft < 10 ? "0" + timeLeft : timeLeft;
                document.getElementById('timer-display').innerText = `00:${seconds}`;

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    explodeBomb();
                }
            }, 1000);
        }

        function defuse(isCorrect) {
            clearInterval(timerInterval);
            if (isCorrect) {
                document.getElementById('result-content').innerHTML = `
                    <h1 style="color: var(--accent-cyan); font-size: 3rem;">🎉 عاش يا أبطال!</h1>
                    <div class="status-msg">تم تفكيك القنبلة بنجاح بنسبة! 💥❌</div>
                    <p>أنقذتوا المكان في أخر لحظة!</p>
                `;
            } else {
                explodeBomb();
            }
            showScreen('screen-result');
        }

        function explodeBomb() {
            document.getElementById('result-content').innerHTML = `
                <h1 style="color: var(--danger-red); font-size: 3rem;">💥 بومممممم!</h1>
                <div class="status-msg">القنبلة فرقعت للأسف! 😈</div>
                <p>اخترتوا السلك الغلط أو الوقت خلص عليكوا!</p>
            `;
            showScreen('screen-result');
        }

        function resetGame() {
            showScreen('screen-lobby');
        }
    </script>
</body>
</html>
